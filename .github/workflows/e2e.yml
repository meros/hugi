name: E2E

# Browser tests of the web app (web/e2e): router, Maker, board, layout on four screen sizes.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: web/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json
      - run: npm ci
        working-directory: web/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: web/e2e
      - run: npx playwright test
        working-directory: web/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            web/e2e/test-results
            web/e2e/playwright-report
            web/e2e/screens
          if-no-files-found: ignore
          retention-days: 7
