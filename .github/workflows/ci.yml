name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p hugi-web --release --target wasm32-unknown-unknown
      - run: cargo test --release
      - run: web/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/test/*.test.mjs
      - name: Solve the example puzzle
        run: cargo run --release -- puzzles/heart.txt
      - name: Check the Python tools compile
        run: python3 -m py_compile ui/hugi_ui.py tune/hard.py tune/cdcl_ab.py compare/run.py compare/sat.py compare/plot.py scripts/make_examples.py
